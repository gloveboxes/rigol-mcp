[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigol-mcp"
version = "0.1.0"
description = "MCP server for Rigol DS1000Z and DHO oscilloscopes over LAN/TCPIP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3",
    "jsonschema>=4.20.0",
    "pyvisa>=1.14.0",
    "pyvisa-py>=0.7.0",
    "python-dotenv>=1.0.0",  # load configuration from a local .env file
]

[project.optional-dependencies]
catalog = ["pypdf>=6.0"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
rigol-mcp = "rigol_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rigol_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Installs the project (src/ layout) plus the test extra from the locked versions.
      # Tests are fully offline — no instrument or network connection required.
      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Build container
        if: matrix.python-version == '3.12'
        run: docker build -t rigol-mcp:ci .

      - name: Test container stdio and runtime
        if: matrix.python-version == '3.12'
        env:
          RIGOL_TEST_IMAGE: rigol-mcp:ci
        run: uv run --no-sync pytest tests/test_container.py
